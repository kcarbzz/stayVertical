<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stay Vertical">
  <rect width="64" height="64" rx="14" fill="#0b1020"/>
  <circle cx="45" cy="16" r="6" fill="#ffd166"/>
  <!-- perfil de terreno en forma de V: dos pendientes distintas -->
  <path d="M8 22 L26 52 L36 34 L56 52" fill="none" stroke="#5ec8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plomada: la línea que se mantiene vertical -->
  <path d="M26 10 V48" stroke="#ff6b4a" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5"/>
</svg>
