<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https://cdnjs.cloudflare.com https://tile.openstreetmap.org https://trek.nasa.gov; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Stay Vertical</title>
<meta name="description" content="Encuentra dónde el terreno de la Tierra, la Luna o Marte se parece a otro.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="style.css?v=20261115-155427">
</head>
<body>
<div id="carga" role="status" aria-live="polite">
  <img src="logo.svg" alt="Stay Vertical" width="260">
  <div class="barra"><div id="progreso"></div></div>
  <p id="carga-texto" data-i18n="cargando">Cargando…</p>
  <noscript><p>Esta página necesita JavaScript.</p></noscript>
</div>

<header>
  <img src="logo.svg" alt="Stay Vertical" height="40">
  <button id="aviso" type="button" hidden data-i18n="aviso" data-i18n-title="avisoTitulo" aria-haspopup="dialog">Resultados exploratorios</button>
  <button id="abrir-hallazgos" type="button" hidden data-i18n="hallazgos">Hallazgos</button>
  <div class="idioma" id="idioma" role="group" data-i18n-aria="idioma" aria-label="Idioma"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button></div>
</header>

<main>
  <section class="ventana" aria-labelledby="h-ref">
    <div class="cab">
      <h2 id="h-ref"><b>1</b> <span data-i18n="hRef">Terreno de referencia</span></h2>
      <div class="fichas" id="f-origen"></div>
    </div>
    <div class="tabs" id="t-modo"></div>
    <nav class="migas" id="migas-ref" data-i18n-aria="migasRef" aria-label="Región de referencia"></nav>
    <div class="buscador" id="b-ref">
      <input type="search" id="q-ref" placeholder="Buscar región…" data-i18n-ph="buscar" data-i18n-aria="buscarRef" autocomplete="off" aria-label="Buscar región de referencia">
      <ul class="lista" id="l-ref" hidden></ul>
    </div>
    <div class="mapa-caja">
      <div id="mapa-ref" class="mapa"></div>
      <div id="sobre-ref" class="sobre" hidden></div>
    </div>
  </section>

  <section class="ventana" aria-labelledby="h-dest">
    <div class="cab">
      <h2 id="h-dest"><b>2</b> <span data-i18n="hDest">Dónde buscar parecidos</span></h2>
      <div class="fichas" id="f-destino"></div>
    </div>
    <div class="tabs" id="t-fuente" hidden></div>
    <nav class="migas" id="migas-dest" data-i18n-aria="migasDest" aria-label="Región elegida"></nav>
    <div class="clima-ctl" id="clima-ctl" hidden>
      <label for="capa-clima" data-i18n="capaClima">Capa de clima</label>
      <select id="capa-clima"></select>
      <label class="chk"><input type="checkbox" id="solo-viables"> <span data-i18n="soloViables">Ocultar zonas con factores difíciles</span></label>
    </div>
    <div class="buscador" id="b-dest">
      <input type="search" id="q-dest" placeholder="Buscar región…" data-i18n-ph="buscar" data-i18n-aria="buscarDest" autocomplete="off" aria-label="Buscar región de destino">
      <ul class="lista" id="l-dest" hidden></ul>
    </div>
    <div class="mapa-caja"><div id="mapa-dest" class="mapa"></div><div id="leyenda-clima" class="leyenda" hidden></div></div>
  </section>

  <div id="tira"></div>
</main>

<dialog id="aviso-panel" aria-labelledby="aviso-titulo">
  <button id="cerrar-aviso" type="button" aria-label="Cerrar / Close">×</button>
  <h3 id="aviso-titulo" data-i18n="aviso">Resultados exploratorios</h3>
  <p id="aviso-contenido"></p>
</dialog>

<dialog id="clima-panel" aria-label="Clima">
  <button id="cerrar-clima" type="button" data-i18n-aria="cerrarVisor" aria-label="Cerrar">×</button>
  <div id="clima-cuerpo"></div>
</dialog>

<dialog id="visor" aria-label="Comparación">
  <button id="cerrar-visor" type="button" data-i18n-aria="cerrarVisor" aria-label="Cerrar">×</button>
  <img id="visor-img" alt="">
</dialog>

<button id="abrir-chat" type="button" aria-expanded="false"><img src="bot.svg" alt="" width="28" height="28"> <span>Vertikal Bot</span></button>
<aside id="asistente" hidden aria-label="Vertikal Bot">
  <div class="cab-chat"><span class="quien"><img src="bot.svg" alt="" width="30" height="30"><b>Vertikal Bot</b></span><button id="cerrar-chat" type="button" data-i18n-aria="cerrar" aria-label="Cerrar">×</button></div>
  <p class="mut peq" data-i18n="botDesc">Explica lo que ves. Una red neuronal pequeña, que corre en tu navegador, entiende la pregunta; las cifras salen de los datos mostrados. No usa IA externa.</p>
  <div id="chat" aria-live="polite"></div>
  <div id="rapidas"></div>
  <form id="form-chat"><input id="pregunta" placeholder="Pregunta…" data-i18n-ph="pregunta" autocomplete="off"><button data-i18n="enviar">Enviar</button></form>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="i18n.js?v=20261115-155427"></script>
<script src="bot_nn.js?v=20261115-155427"></script>
<script src="analogia.js?v=20261115-155427"></script>
<script src="clima.js?v=20261115-155427"></script>
<script src="asistente.js?v=20261115-155427"></script>
<script src="polar.js?v=20261115-155427"></script>
<script src="app.js?v=20261115-155427"></script>
</body>
</html>
